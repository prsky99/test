name: Public frontend regressions

on:
  pull_request:
    paths:
      - 'agent_market/**'
      - 'tests/**'
      - 'scripts/**'
      - 'extracted_html.txt'
      - 'requirements*'
      - 'cloudflare/edge-gateway/package*.json'
      - 'deploy/runtime-versions.json'
      - 'AGENT_FRONT.md'
      - '.github/workflows/frontend-regressions.yml'
  push:
    branches: [main, master]
    paths:
      - 'agent_market/**'
      - 'tests/**'
      - 'scripts/**'
      - 'extracted_html.txt'
      - 'requirements*'
      - 'cloudflare/edge-gateway/package*.json'
      - 'deploy/runtime-versions.json'
      - 'AGENT_FRONT.md'
      - '.github/workflows/frontend-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-regressions:
    name: Isolated regressions (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install disposable PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --yes postgresql-16 libpq-dev build-essential
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/lib/postgresql/16/bin/pg_ctl
          test -x /usr/lib/postgresql/16/bin/pg_dump
          test -x /usr/lib/postgresql/16/bin/pg_restore
          sudo install -d -m 1777 /private/tmp
          test -w /private/tmp
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --no-cache-dir --require-hashes --no-build-isolation -r requirements-dev.lock
          python -m pip uninstall --yes setuptools wheel
          python scripts/audit_dependency_profile.py --profile dev
      - name: Install isolated browser
        run: python -m playwright install --with-deps chromium
      - name: Run feature, security and catalog policy corpus regressions
        run: python scripts/run_frontend_regressions.py --shard-index ${{ matrix.shard }} --shard-count 4 --output reports/frontend-regressions-${{ matrix.shard }}

  dependency-security:
    name: Locked dependency security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.12.1'
      - name: Install reviewed audit tools
        run: python -m pip install --require-hashes -r requirements-security.lock
      - name: Audit complete production and test locks
        run: |
          python -m pip_audit --disable-pip --no-deps -r requirements-runtime.lock
          python -m pip_audit --disable-pip --no-deps -r requirements-dev.lock
      - name: Audit and test the edge gateway
        run: |
          npm --prefix cloudflare/edge-gateway ci --ignore-scripts
          npm --prefix cloudflare/edge-gateway audit --audit-level=low --ignore-scripts
          npm --prefix cloudflare/edge-gateway test
