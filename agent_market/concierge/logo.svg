<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" class="ac-logo-svg" aria-label="Agent Concierge AC Logo">
  <defs>
    <linearGradient id="acLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="45%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="acBoltGrad" x1="10" y1="4" x2="20" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="acGlowFilter" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.8" flood-color="#00f5ff" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background Badge Container -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#0c1322" stroke="url(#acLogoGrad)" stroke-width="1.4" stroke-opacity="0.55"/>
  <!-- 'A' Monogram Left Wing -->
  <path d="M12 5.5 L5 25.5 L8.5 25.5 L10.2 20.5 L14.5 20.5 L13.5 17 L11.5 17 L12.8 13 L14.8 20.5 L17.5 20.5 L13.5 5.5 Z" fill="url(#acLogoGrad)"/>
  <!-- Central High-Voltage Lightning Bolt forming 'A' crossbar -->
  <path d="M15 4.5 L8.5 17.5 L13.5 17.5 L10 27.5 L19.5 14.5 L14.5 14.5 L17.5 4.5 Z" fill="url(#acBoltGrad)" filter="url(#acGlowFilter)"/>
  <!-- 'C' Monogram with Faceted Lightning Arcs -->
  <path d="M26 7.5 L19.5 7.5 L17 11.5 L21.5 11.5 C22.8 13.8 22.8 18.2 21.5 20.5 L17 20.5 L19.5 24.5 L26 24.5 L27.5 21 L25 19.5 C26 17.5 26 14.5 25 12.5 L27.5 11 Z" fill="url(#acLogoGrad)"/>
</svg>
