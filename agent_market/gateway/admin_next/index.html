<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Agent Concierge 운영</title>
<link rel="stylesheet" href="/admin/next/assets/pearl-tokens.css">
<link rel="stylesheet" href="/admin/next/assets/admin-pearl.css">
<script type="module" src="/admin/next/assets/core/app.js"></script>
</head>
<body>
<a class="adm-sr adm-skip" href="#adm-main">본문으로 건너뛰기</a>
<header class="adm-top">
  <a class="adm-brand" href="#/home" aria-label="Agent Concierge 운영 홈"><span class="adm-brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Agent Concierge <small>운영</small></span></a>
  <form class="adm-search" id="adm-search" role="search" hidden>
    <svg class="adm-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <label class="adm-sr" for="adm-search-input">에이전트·고객·조직·실행 ID 검색</label>
    <select id="adm-search-kind" aria-label="검색 대상"><option value="agent">에이전트·ID</option><option value="workflow">워크플로</option></select>
    <input id="adm-search-input" type="search" maxlength="120" placeholder="에이전트 이름·주소 또는 고객·조직·실행 ID">
  </form>
  <button class="adm-btn" id="adm-theme" type="button" aria-pressed="false" aria-label="다크 테마 전환">
    <svg class="adm-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>
  <a class="adm-btn" href="#/home/x04" data-auth-action hidden aria-label="내 업무·알림">내 업무</a>
  <a class="adm-btn" href="#/home/x03" data-auth-action hidden aria-label="통합 검색">통합 검색</a>
  <span id="adm-me" class="adm-muted" hidden></span>
  <button class="adm-btn" id="adm-logout" type="button" hidden>로그아웃</button>
</header>
<div class="adm-layout" id="adm-layout" hidden>
  <nav class="adm-nav" aria-label="운영 영역">
    <ol id="adm-nav"></ol>
  </nav>
  <main class="adm-main" id="adm-main" tabindex="-1"></main>
</div>
<section class="adm-card adm-login" id="adm-login" hidden aria-labelledby="adm-login-title">
  <p class="adm-eyebrow">Agent Concierge</p>
  <h1 id="adm-login-title">운영 콘솔 로그인</h1>
  <p class="adm-muted">개인 관리자 계정으로 로그인하세요. 공용 토큰과 로컬 자동 로그인은 이 화면에서 사용할 수 없습니다.</p>
  <form id="adm-login-form">
    <label for="adm-user">아이디</label><input id="adm-user" autocomplete="username" required maxlength="80">
    <label for="adm-pass">비밀번호</label><input id="adm-pass" type="password" autocomplete="current-password" required maxlength="200">
    <p class="adm-status" id="adm-login-status" role="status" aria-live="polite"></p>
    <button class="adm-btn primary" type="submit">로그인</button>
  </form>
</section>
<section class="adm-card adm-login" id="adm-password" hidden aria-labelledby="adm-password-title">
  <h1 id="adm-password-title">초기 비밀번호 변경</h1>
  <p>업무 정보를 열기 전에 본인만 아는 비밀번호로 변경하세요. 변경 후 모든 기존 세션이 종료됩니다.</p>
  <form id="adm-password-form">
    <label for="adm-current-password">현재 비밀번호</label><input id="adm-current-password" type="password" autocomplete="current-password" required maxlength="1024">
    <label for="adm-new-password">새 비밀번호 (15~128자)</label><input id="adm-new-password" type="password" autocomplete="new-password" required minlength="15" maxlength="128">
    <label for="adm-confirm-password">새 비밀번호 확인</label><input id="adm-confirm-password" type="password" autocomplete="new-password" required minlength="15" maxlength="128">
    <p id="adm-password-status" class="adm-status" role="status" aria-live="polite"></p>
    <button class="adm-btn primary" type="submit">변경 후 다시 로그인</button>
  </form>
</section>
</body>
</html>
