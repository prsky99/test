function renderContent(){const s=D.screens.find(s=>s.id===selected),host=$('content');host.replaceChildren(el('div',{class:'path',text:'운영 콘솔 / '+names[s.group]+' / '+s.id}),el('div',{class:'head'},[el('h1',{text:s.title}),btn(s.primary+' · 시안',()=>review(s),true)]),el('p',{class:'purpose',text:s.task}));if(mode==='spec'){host.append(showSpec(s));return}if(state!=='normal'&&state!=='stale'){statusState(s,host);host.append(listBlock('이 상태의 필수 검수',[s.acceptance[3],'현재 표시한 상태는 시안입니다. 운영 서비스 상태가 아닙니다.']));return}if(state==='stale')host.append(el('div',{class:'message',role:'status',text:'10:20 기준 자료를 표시합니다. 일부 갱신에 실패했습니다. 조회된 항목과 입력은 유지합니다.'}));if(s.id==='C01'){stats(host,[['수집 작업자','연결됨','예시 · 마지막 확인 10:20'],['현재 수집','1곳','예시 · MCP Registry'],['최근 신규 등록','28개','예시 · 최근 3회 완료 기준'],['확인할 제공자','1곳','예시 · 연결 상태 확인 필요']]);host.append(el('div',{class:'taskline'},[el('span',{class:'dot'}),el('span',{text:'MCP Registry 수집 중 · 확인한 항목 1,240개 · 최근 갱신 10:20'}),btn('작업 상세',()=>details(s,rows(s)[0]))]));table(s,host);host.append(el('p',{class:'muted',text:'제공자별 수집 처리 건수입니다. 전체 카탈로그의 중복 제거 후 에이전트 수와는 다릅니다.'}));return}if(s.id==='H01'){stats(host,[['공개 에이전트','1,284','예시 · 현재 카탈로그'],['최근 점검 완료','1,218','예시 · 최근 6시간'],['확인할 실행','2건','예시 · 실패와 미확인'],['내 처리 대기','4건','예시 · 지원·승인']]);host.append(el('h2',{text:'지금 처리할 일'}));table(s,host);return}if(s.id==='U07'){stats(host,[['신규 가입 지급','100개','정책 · 계정당 한 번'],['예시 고객 잔액','98개','예시 · 2개 사용'],['기존 가입자 잔액','그대로 유지','정책 · 추가 97개 지급 없음'],['재가입 추가 지급','없음','정책 · 중복 지급 차단']]);host.append(el('p',{class:'message',text:'정정은 지급·차감 이력을 확인한 후 승인 요청으로 진행합니다.'}));table(s,host);return}if(['A03','A06','W03'].includes(s.id)){if(s.id==='W03')pearls(s,host);form(s,host);return}if(['W01','W05','W06','P05'].includes(s.id))pearls(s,host);if(s.id==='S01'){host.append(el('div',{class:'message',text:'승인 전에 대상·변경 전후·영향 범위·요청자를 확인하세요. 요청과 적용은 구분합니다.'}));}if(s.id==='U05'){host.append(el('div',{class:'two'},[el('section',{},[el('h2',{text:'고객 대화'}),el('div',{class:'message',text:'예시 고객: 저장된 워크플로의 다운로드 방법을 알고 싶습니다.'}),el('div',{class:'message',text:'예시 담당자: 저장된 버전의 테스트 결과와 다운로드 경로를 확인하겠습니다.'})]),el('section',{class:'form'},[el('h2',{text:'답변 작성'}),field('고객에게 보낼 답변',el('textarea',{rows:'5','aria-label':'고객 답변'})),el('p',{class:'muted',text:'내부 메모는 고객에게 전송하지 않는 별도 영역입니다.'}),btn('답변 전송 검토 · 시안',()=>review(s),true)])]));return}if(s.kind==='common'){host.append(showSpec(s));return}if(['A07','C02','C03','C04','C05','T01','T02'].includes(s.id))host.append(el('div',{class:'taskline'},el('span',{text:'최근 확인 10:20 · 예시 상태입니다. 대상 항목을 선택하면 상세 내용을 확인할 수 있습니다.'})));table(s,host);host.append(el('p',{class:'muted',text:s.first}))}
function render(){nav();renderContent()}window.addEventListener('resize',nav);document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('overlay').replaceChildren();$('main').focus()}});render();
